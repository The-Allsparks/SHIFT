version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # JUnit 6 needs Java 17; Hub libraries still compile tests for Java 8 bytecode.
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
