name: CI

# test          — compile, unit tests, architecture tests, examples, artifacts, spotless, schema files
# sdk-compile   — shift-ftc / examples against RobotCore 12.0.0
# docs-structure — required documentation present
#
# Architecture tests run inside `./gradlew check`.
# CodeQL job `Analyze Java` is a separate required workflow (see docs/release.md).
#
# Third-party actions are pinned to full commit SHAs. Version comments keep
# Dependabot able to propose pin updates.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Compile, test, examples, artifacts
        run: ./gradlew check javadocAll assembleReleaseArtifacts --no-daemon

  sdk-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        run: chmod +x gradlew
      - name: Compile adapters against FTC SDK 12.0.0
        run: ./gradlew compileAgainstFtcSdk --no-daemon

  docs-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Required documentation present
        run: |
          set -e
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f AGENTS.md
          test -f docs/architecture.md
          test -f docs/configuration.md
          test -f docs/intent-design.md
          test -f docs/compatibility.md
          test -f docs/migration.md
          test -f docs/deferred.md
          test -f docs/research/upstream.md
          test -f docs/audits/initial-deep-audit.md
          test -f docs/audits/priority-ledger.md
          test -f docs/audits/hub-evidence-2026-09-08.md
          test -f docs/release.md
          test -f docs/INSTALL.md
          test -f docs/TEACHING.md
          test -f docs/integrations.md
          test -f schema/shift-profile-v1.json
          test -f examples/profiles/competition-example.json
          test -f examples/profiles/fallback.json
          test -f examples/profiles/studenta-general.json
          test -f examples/profiles/studenta-offense.json
          test -f examples/profiles/studentb-general.json
          test -f .github/workflows/codeql.yml
          test -f .github/ISSUE_TEMPLATE/phase_work.md
